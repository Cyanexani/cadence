<script src="/engine.js"></script>
<script>
  window.fakeEmbeds = [];
  window.YT = { Player: class {
    constructor(slot, cfg) { this.slot = slot; this.cfg = cfg; this.calls = []; this.vol = null; this.muted = false; this.iframe = document.createElement("iframe"); fakeEmbeds.push(this); setTimeout(() => cfg.events.onReady(), 0); }
    getIframe() { return this.iframe; }
    loadVideoById(o) { this.calls.push(["load", o]); setTimeout(() => this.cfg.events.onStateChange({ data: 1 }), 5); }
    cueVideoById(o) { this.calls.push(["cue", o]); }
    playVideo() { this.calls.push(["play"]); } pauseVideo() { this.calls.push(["pause"]); }
    seekTo(s) { this.calls.push(["seek", s]); } stopVideo() { this.calls.push(["stop"]); }
    setVolume(v) { this.vol = v; } mute() { this.muted = true; } unMute() { this.muted = false; }
    getCurrentTime() { return 7; } getDuration() { return 100; } getPlayerState() { return 1; }
  } };
  window.makeHybrid = (slot = "yt-a") => new HybridPlayer({
    onReady: () => events.push(["ready"]),
    onStateChange: (e) => events.push(["state", e.data, e.target === window.h]),
    onError: (e) => events.push(["error", e.data]),
    onQuality: (p, label) => events.push(["quality", label]),
  }, (ev) => new ElementPlayer(ev), slot);
  window.makePlayer = () => new ElementPlayer({
    onReady: () => events.push(["ready"]),
    onStateChange: (e) => events.push(["state", e.data]),
    onError: (e) => events.push(["error", e.data]),
    onQuality: (p, label) => events.push(["quality", label]),
  });
</script>
